name: Sync VMPay Clients to Supabase

on:
  schedule:
    - cron: '0 3 * * *' # Roda todos os dias às 03:00 UTC
  workflow_dispatch: # Permite rodar manualmente no GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install @supabase/supabase-js node-fetch

      - name: Run sync script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VMPAY_API_KEY: ${{ secrets.VMPAY_API_KEY }}
        run: node scripts/sync-vmpay.js
